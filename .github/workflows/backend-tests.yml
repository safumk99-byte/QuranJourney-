name: Backend tests
on:
  push:
    branches: [main, feature/teacher-parent-neon-backend]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Test Madani 1405 Mushaf image and ayah-coordinate endpoints
        run: pytest tests/test_mushaf_endpoints.py
      - name: Run complete backend test suite
        run: pytest
