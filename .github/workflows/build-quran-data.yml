name: Build bundled Quran data
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-quran-data.cjs
      - quran.js
      - .github/workflows/build-quran-data.yml
jobs:
  build-quran-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Quran reader JavaScript syntax
        run: node --check quran.js
      - name: Check Quran data builder syntax
        run: node --check scripts/build-quran-data.cjs
      - name: Build and validate Quran corpus
        run: node scripts/build-quran-data.cjs
      - name: Confirm bundled corpus is present
        run: test -s data/quran-uthmani.json
