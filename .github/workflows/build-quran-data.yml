name: Build bundled Quran data
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/build-quran-data.cjs
jobs:
  build-quran-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and validate Quran corpus
        run: node scripts/build-quran-data.cjs
      - name: Commit bundled data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quran-uthmani.json
          git diff --cached --quiet || git commit -m "Add verified bundled Uthmani Quran data"
          git push
