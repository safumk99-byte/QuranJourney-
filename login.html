<!doctype html>
<html lang="en"><head><meta charset="utf-8"><script>(()=>{try{const s=localStorage.getItem('qj-theme');const d=s==='dark'||(s!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.style.colorScheme=d?'dark':'light'}catch(_){}})();</script><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5b46"><title>Login | Quran Journey</title><link rel="stylesheet" href="./style.css?v=dark-mode-20261027"><link rel="icon" type="image/svg+xml" href="./icon.svg"><style>
.login-wrap{max-width:480px;margin:7vh auto;padding:0 16px}.login-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,36px);box-shadow:0 12px 36px #18352c12}.login-card h1{color:var(--deep);font-size:28px;margin:8px 0}.login-card p{color:var(--muted);line-height:1.7}.login-card .btn{width:100%;margin-top:8px}.login-error{display:none;padding:12px;border-radius:10px;background:#fff0ef;color:#9b2929;font-size:13px;margin:14px 0}.login-error.show{display:block}.login-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
</style></head><body><header class="topbar"><div class="brandmark">۞</div><div><div class="brand">Quran Journey</div><div class="tagline">Every child's journey with the Quran</div></div></header><main class="login-wrap"><section class="login-card"><div class="eyebrow green">SECURE ACCESS</div><h1>Welcome back</h1><p>Sign in as a Teacher or Parent to continue.</p><form id="loginForm"><label>Login ID<input id="loginId" autocomplete="username" required maxlength="80" placeholder="Enter your Login ID"></label><label>Password<input id="password" type="password" autocomplete="current-password" required maxlength="256" placeholder="Enter your password"></label><button class="btn primary" id="submitBtn" type="submit">Sign In</button></form><div class="login-error" id="error" role="alert"></div></section><div class="login-foot">Teacher and Parent accounts only · No student login</div></main><script src="./config.js"></script><script src="./auth.js"></script><script>
(()=>{const $=id=>document.getElementById(id);if(window.QuranJourneyAuth.getToken()&&window.QuranJourneyAuth.getUser()){location.replace(window.QuranJourneyAuth.getUser().role==='parent'?'./parent.html':'./index.html');return}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submitBtn'),error=$('error');btn.disabled=true;btn.textContent='Signing in…';error.classList.remove('show');try{const user=await window.QuranJourneyAuth.login($('loginId').value.trim(),$('password').value);location.replace(user.role==='parent'?'./parent.html':'./index.html')}catch(err){error.textContent=err.message;error.classList.add('show')}finally{btn.disabled=false;btn.textContent='Sign In'}})})();
</script><script src="./theme.js?v=dark-mode-20261027"></script></body></html>
