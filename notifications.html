<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b5b46"><title>Teacher Notifications | Quran Journey"><link rel="stylesheet" href="./style.css?v=dark-mode-20261027b"><script src="./config.js"></script><script src="./auth.js"></script><script>try{if(!window.QuranJourneyAuth||!window.QuranJourneyAuth.requireRole(['teacher'])){document.documentElement.dataset.authPending='true';}}catch(e){document.documentElement.dataset.authError='true';console.error('Quran Journey teacher page authentication check failed:',e);}</script><link rel="manifest" href="./manifest.json"></head>
<body class="teacher-notifications-page"><header class="topbar"><div class="brandmark">۞</div><div><div class="brand">Quran Journey</div><div class="tagline">Send updates to parents</div></div></header>
<main class="container"><section class="hero"><div><div class="eyebrow">TEACHER WORKSPACE</div><h1>Parent Notifications</h1><p>Send a message to parents of a selected student, or announce it to parents of all students.</p></div><div class="hero-art" aria-hidden="true">✉<span>Quran Journey</span></div></section>
<section class="panel teacher-notification-panel"><div class="section-head"><div><div class="eyebrow green">CREATE NOTIFICATION</div><h2>New parent message</h2></div></div>
<form id="notificationForm"><label>Recipients<select id="studentId" required><option value="all">All students — all linked parents</option></select><small>Only parents linked to the selected student(s) will receive the message.</small></label>
<label>Title<input id="notificationTitle" type="text" maxlength="180" required placeholder="e.g. Important class update"></label>
<label>Message<textarea id="notificationMessage" rows="5" maxlength="2000" required placeholder="Write the message for parents…"></textarea><small>Maximum 2,000 characters.</small></label>
<div class="notification-preview"><strong>Note</strong><span>This creates an in-app notification in the Parent Dashboard. It does not send SMS, WhatsApp, email, or phone push notifications.</span></div>
<div class="notification-actions"><button class="btn secondary" type="reset">Clear</button><button class="btn primary" type="submit" id="sendNotificationBtn">Send Notification</button></div><p id="notificationStatus" role="status" aria-live="polite"></p></form></section><footer>Quran Journey <span>•</span> Teacher Notifications</footer></main>
<script src="./notifications.js?v=teacher-parent-notifications-20261028"></script><script src="./nav.js"></script><script src="./theme.js?v=dark-mode-20261027"></script></body></html>
