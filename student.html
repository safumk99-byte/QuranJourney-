<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Details | Quran Journey</title><link rel="stylesheet" href="./style.css"></head><body class="student-detail-page"><header class="topbar"><div><div class="brand">Quran Journey</div><div class="tagline">Student Details</div></div><a class="top-pill nav-pill" href="./students.html">← Students Directory</a></header><main class="container"><section class="hero"><div><div class="eyebrow">STUDENT PROFILE</div><h1 id="studentName">Student Details</h1><p id="studentMeta"></p></div></section><section class="panel" id="studentSummary"></section><section class="panel"><h2 id="formTitle">Add Daily Entry</h2><form id="entryForm"><input type="hidden" id="entryId"><div class="field-row"><label>Date<input id="entryDate" type="date" required></label><label>Attendance<select id="attendance"><option>Present</option><option>Absent</option><option>Leave</option></select></label></div><div class="field-row"><label>New Lesson<textarea id="newLesson" rows="2"></textarea></label><label>Pages<input id="lessonPages" type="number" min="0" step="1" value="0" required><small>Pages learned in this new lesson.</small></label><label>Recent Revision<textarea id="recentRevision" rows="2"></textarea></label></div><div class="field-row"><label>General Revision<textarea id="generalRevision" rows="2"></textarea></label><label>Remarks<textarea id="remarks" rows="2"></textarea></label></div><div class="field-row"><label>Points (automatic)<input id="dailyPoints" type="number" readonly></label><div class="actions"><button class="btn primary" type="submit" id="saveBtn">Save Entry</button><button class="btn secondary" type="button" id="cancelBtn" hidden>Cancel</button></div></div></form></section><section class="panel"><h2>Daily Reading Table</h2><div class="table-wrap"><table class="daily-history"><thead><tr><th>Date</th><th>New Lesson</th><th>Pages</th><th>Recent Revision</th><th>General Revision</th><th>Attendance</th><th>Remarks</th><th>Points</th><th>Actions</th></tr></thead><tbody id="entryRows"></tbody></table></div><p id="emptyRows">No daily entries yet.</p></section></main><script src="./student.js"></script></body></html>
